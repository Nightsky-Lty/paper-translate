name: paper-translate
services:
  app:
    build: .
    image: paper-translate:local
    restart: unless-stopped
    environment:
      PAPER_TRANSLATE_MODE: server
      PAPER_TRANSLATE_PUBLIC_URL: ${PAPER_TRANSLATE_PUBLIC_URL:?Set PAPER_TRANSLATE_PUBLIC_URL in .env}
      PAPER_TRANSLATE_ACCESS_USER: ${PAPER_TRANSLATE_ACCESS_USER:-reader}
      PAPER_TRANSLATE_PASSWORD_HASH_FILE: /app/data/access-password.hash
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - paper_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 200s

volumes:
  paper_data:
